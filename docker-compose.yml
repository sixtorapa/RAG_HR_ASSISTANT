services:
  # ── Flask application ────────────────────────────────────────────────────
  app:
    build: .
    container_name: hr_kb_app
    ports:
      # 8080 rather than 5001: the Dockerfile sets PORT=8080 and gunicorn listens
      # there. Compose never exported PORT, so publishing 5001 served nobody.
      - "8080:8080"
    env_file:
      - .env                         # never commit this file
    environment:
      - FLASK_ENV=development
      - UP_VECTOR_STORE_PATH=/data/vector_store
      - UP_DOC_PATH=/data/docs
      - HR_DB_URI=sqlite:////data/hr_data.db
    volumes:
      # Persist vector store, docs and DB across container restarts
      - hr_data:/data
      # Hot-reload source during development (remove in prod)
      - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Standalone ChromaDB — DISABLED ───────────────────────────────────────
  # The app uses Chroma EMBEDDED: `Chroma(persist_directory=...)` in qa_chain.py,
  # ingester.py and summarizer.py. There is no HTTP client against a server, so
  # this service was starting a container nobody talked to.
  #
  # chromadb:
  #   image: chromadb/chroma:latest
  #   container_name: hr_kb_chroma
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - chroma_data:/chroma/chroma
  #   restart: unless-stopped
  #   environment:
  #     - ALLOW_RESET=true

volumes:
  hr_data:
